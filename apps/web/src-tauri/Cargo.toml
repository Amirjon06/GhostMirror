[package]
name = "ghostmirror"
version = "0.2.0"
description = "Local development activity dashboard"
authors = ["Amirjon Abdunayimov"]
edition = "2021"

[lib]
name = "ghostmirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
